name: Release with goreleaser

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions: write-all # Necessary for the generate-build-provenance action with containers

jobs:

  build:


    runs-on: ubuntu-latest

    steps:
      - name: Set up latest stable Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: stable
      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-tags: 1
          fetch-depth: 0
      # Set environment variables required by GoReleaser
      - name: Set build environment variables
        run: |
          echo "GIT_STATE=$(if git diff-index --quiet HEAD --; then echo 'clean'; else echo 'dirty'; fi)" >> $GITHUB_ENV
          echo "BUILD_HOST=$(hostname)" >> $GITHUB_ENV
          echo "GO_VERSION=$(go version | awk '{print $3}')" >> $GITHUB_ENV
          echo "BUILD_USER=$(whoami)" >> $GITHUB_ENV
          echo "IS_PR_BUILD=false" >> $GITHUB_ENV

      - name: Release with goreleaser
        uses: goreleaser/goreleaser-action@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: latest
          args: release --clean
        id: goreleaser
      - name: Process goreleaser output
        id: process_goreleaser_output
        run: |
          echo "const fs = require('fs');" > process.js
          echo 'const artifacts = ${{ steps.goreleaser.outputs.artifacts }}' >> process.js
          echo "const compactorArtifact = artifacts.find(artifact => artifact.name && artifact.name.includes('compactor') && artifact.extra && artifact.extra.Digest);" >> process.js
          echo "const queryArtifact = artifacts.find(artifact => artifact.name && artifact.name.includes('query') && artifact.extra && artifact.extra.Digest);" >> process.js
          echo "console.log('Compactor digest:', compactorArtifact?.extra.Digest);" >> process.js
          echo "console.log('Query digest:', queryArtifact?.extra.Digest);" >> process.js
          echo "if (compactorArtifact) fs.writeFileSync('compactor-digest.txt', compactorArtifact.extra.Digest);" >> process.js
          echo "if (queryArtifact) fs.writeFileSync('query-digest.txt', queryArtifact.extra.Digest);" >> process.js
          node process.js
          echo "compactor_digest=$(cat compactor-digest.txt)" >> $GITHUB_OUTPUT
          echo "query_digest=$(cat query-digest.txt)" >> $GITHUB_OUTPUT
      - name: Attest binaries
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/**
      - name: generate build provenance for compactor container
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/openchami/openchami-logq-compactor
          subject-digest: ${{ steps.process_goreleaser_output.outputs.compactor_digest }}
          push-to-registry: true
      - name: generate build provenance for query container
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/openchami/openchami-logq-query
          subject-digest: ${{ steps.process_goreleaser_output.outputs.query_digest }}
          push-to-registry: true
