sources:
  cloudevents_raw:
    type: http_server
    address: "0.0.0.0:8910"
    decoding:
      # needs to be raw to simplify processing with VRL transforms
      # and ensure we meet the schemaless paradigm requirements
      #
      # however, right now we are still assuming content-type is at least json
      # adjacent
      codec: bytes
    headers:
      - "*"
transforms:
  cloudevents_clean:
    type: remap
    inputs:
      - cloudevents_raw
    source: |
      # extract all ce- headers into cloudevent object
      .cloudevent = {}
      for_each(.) -> |key, value| {
        if starts_with(key, "ce-") {
          # log(key, level: "error", rate_limit_secs: 0)
          .cloudevent = set!(.cloudevent, [slice!(key, 3)], value)
          result, err = remove(., [key])
          if err == null {
            . = result
          }
        }
      }
      if .message != "" {
        body = parse_json!(string!(.message))
        if exists(body.data) {
          .cloudevent.data = del(body.data)
          .cloudevent = merge!(.cloudevent, body)
        } else {
          .cloudevent.data = body
        }
      }
      del(.message)
sinks:
  console:
    type: console
    inputs:
      - cloudevents_clean
    encoding:
      codec: json
  s3_local_cloudevents:
    inputs:
      - cloudevents_clean
    type: aws_s3
    region: "${S3_REGION:?}"
    endpoint: "${S3_ENDPOINT:?}"
    bucket: "${S3_BUCKET:?}"
    auth:
      access_key_id: "${S3_ACCESS_KEY:?}"
      secret_access_key: "${S3_SECRET_KEY:?}"
    compression: zstd
    filename_extension: "ndjson.zst"
    key_prefix: "events/date=%F/hour=%H/"
    buffer:
      - type: disk
        max_size: 268435488 # 256MiB.
        when_full: block
    # configuration "hack" for ndjson:
    # https://github.com/vectordotdev/vector/issues/20053#issuecomment-1988951588
    encoding: {codec: json}
    framing: {method: "newline_delimited"}
    # note: as of v0.53.0, auto draining disk buffers to remote stores during
    # graceful shutdown is not possible. This issue discusses the idea and lack
    # of support from the dev team (~two years with ongoing discussions):
    # https://github.com/vectordotdev/vector/issues/19600#issuecomment-3036550530
    #
    # fluentbit allegedly supports this behavior out of the box along with
    # having more sane configuration elements for things like ndjson (less
    # hacky). for now, let's keep vector and move forward with the notion that
    # it's probably getting scrapped later.
    #
    # so for that reason, the batch timer is set to one minute instead of the
    # hourly configuration desired by the specification. essentially, try to
    # ensure as many logs are pushed to the remote as possible while still
    # batching. don't have an hour's worth of logs just hanging out on disk
    # when the program gets killed for arbitrary reasons. that way the logq
    # tool has a shot at performing as designed.
    # batch: { timeout_secs: 3600 } # hourly
    batch: {timeout_secs: 60} # one minute
