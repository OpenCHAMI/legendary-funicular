sources:
  cloudevents:
    type: http_server
    address: "0.0.0.0:8910"
    decoding:
      # needs to be raw to simplify processing with VRL transforms
      # and ensure we meet the schemaless paradigm requirements
      #
      # however, right now we are still assuming content-type is at least json
      # adjacent
      codec: bytes
    headers:
      - "*"
transforms:
  parse_cloudevents:
    type: remap
    inputs:
      - cloudevents
    source: |
      # extract all ce- headers into cloudevent object
      .cloudevent = {}
      for_each(.) -> |key, value| {
        if starts_with(key, "ce-") {
          # log(key, level: "error", rate_limit_secs: 0)
          .cloudevent = set!(.cloudevent, [slice!(key, 3)], value)
          result, err = remove(., [key])
          if err == null {
            . = result
          }
        }
      }
      if .message != "" {
        body = parse_json!(string!(.message))
        if exists(body.data) {
          .cloudevent.data = del(body.data)
          .cloudevent = merge!(.cloudevent, body)
        } else {
          .cloudevent.data = body
        }
      }
      del(.message)
sinks:
  console:
    type: console
    inputs:
      - parse_cloudevents
    encoding:
      codec: json
