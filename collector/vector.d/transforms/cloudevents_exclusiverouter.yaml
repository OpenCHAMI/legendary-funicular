type: exclusive_route
inputs:
  - cloudevents_preparer
# target services with potentially parsible message formats (even if intermittent)
# unspecified services are implicitly tossed into the "_unmatched" route
routes:
  - name: "http"
    condition:
      type: vrl
      source: .source_type == "http_server"
