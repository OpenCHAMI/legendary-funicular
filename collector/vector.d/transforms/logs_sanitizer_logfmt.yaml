type: remap
inputs:
  - logs_exclusiverouter.registry
  - logs_exclusiverouter.coresmd_coredns
  - logs_exclusiverouter.coresmd_coredhcp
  - logs_exclusiverouter.smd
  - logs_exclusiverouter.hydra
  - logs_exclusiverouter.step_ca
  - logs_exclusiverouter.cloud_init_server
source: |-
  if .msg != "" {
    result, .parse_error = parse_logfmt(string!(.msg))
    if .parse_error == null {
      .data = result
    }
  }
