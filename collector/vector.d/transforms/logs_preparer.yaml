type: remap
inputs:
  - syslog_udp_logs
source: |
  # todo: convert to rigid schema with unstructured jsonstr columns
  # in a manner similar to the new cloudevents schema. keep fields
  # required by the syslog protocol in the root context, with remaining
  # fields placed in the appropriate nested structures

  # perform common renames
  .ts = .timestamp
  del(.timestamp)

  .service = .appname
  del(.appname)

  .level = .severity
  del(.severity)

  .msg = .message
  del(.message)

  # prepare for parsing by creating defaults for parse error and parsed data storage
  # 
  # prepare all openchami-specific fields with null values
  # with our current service logs, AFAIK it is not possible to grab these
  # fields as they aren't attached to anything... so this is future prep
  .xname = null
  .component_id = null
  .node_id = null
  .request_user = null
  .request_uri = null
  .request_id = null
  .trace_id = null
  .parse_error = null
  .data = {}

  # remove nuisance ansi sequences...
  .msg = replace!(.msg, r'(\x1b|\#033)\[[0-?]*[ -/]*[@-~]', "")
