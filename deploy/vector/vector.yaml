# Example Vector configuration for openchami-logq
# See: https://vector.dev/docs/reference/configuration/

sources:
  syslog:
    type: syslog
    mode: tcp
    address: 0.0.0.0:514

transforms:
  parse:
    type: remap
    inputs: ["syslog"]
    source: |
      .ts = .timestamp
      .host = .hostname
      .msg = .message
      .level = .severity

sinks:
  s3:
    type: aws_s3
    inputs: ["parse"]
    bucket: openchami-logs-raw
    key_prefix: logs/
    compression: none
    encoding:
      codec: ndjson
    batch:
      max_bytes: 10485760  # 10MB
      timeout_secs: 300     # 5 minutes
    auth:
      access_key_id: "${S3_ACCESS_KEY}"
      secret_access_key: "${S3_SECRET_KEY}"
    endpoint: "${S3_ENDPOINT}"
    region: us-east-1
